<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAISON DE CHI</title>
    
    <!-- Luxurious Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-gradient: linear-gradient(45deg, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            --pearl: #FFFDFB;
            --soft-blush: #F8F0EE;
            --deep-gold: #996515;
            --glass: rgba(255, 255, 255, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--pearl);
            font-family: 'Montserrat', sans-serif;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        /* Mesmerizing Background Texture */
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/white-diamond.png');
            opacity: 0.3; z-index: -1;
        }

        /* Glamorous Header */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(255,253,251,0.7), rgba(255,253,251,0.7)), 
                        url('https://images.unsplash.com/photo-1513519245088-0e12902e5a38?q=80&w=2000'); /* Soft Luxury Interior Background */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .brand-box {
            padding: 40px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(185, 147, 54, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            animation: fadeInReveal 2.5s ease-out;
        }

        .brand-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(2.5rem, 12vw, 5rem);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 15px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .tagline {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--deep-gold);
            letter-spacing: 5px;
            text-transform: lowercase;
        }

        /* Product Gallery Section */
        .gallery-title {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            margin: 100px 0 50px;
            letter-spacing: 10px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px 100px;
        }

        #product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 60px;
        }

        /* Extraordinary Product Cards */
        .product-card {
            background: white;
            position: relative;
            overflow: hidden;
            transition: 0.8s cubic-bezier(0.2, 1, 0.2, 1);
            border: 1px solid #f0f0f0;
        }

        .product-card:hover {
            transform: translateY(-20px);
            box-shadow: 0 30px 60px rgba(185, 147, 54, 0.15);
        }

        .img-container {
            width: 100%;
            height: 500px;
            overflow: hidden;
            position: relative;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 1.5s ease;
        }

        .product-card:hover img {
            transform: scale(1.1);
        }

        /* Card Overlay Info */
        .product-info {
            padding: 30px;
            text-align: center;
            background: white;
            position: relative;
        }

        .product-name {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #1a1a1a;
            letter-spacing: 2px;
        }

        .product-price {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 1.2rem;
            color: var(--deep-gold);
            margin-bottom: 25px;
            display: block;
        }

        /* Extraordinary Button */
        .gold-btn {
            display: inline-block;
            width: 100%;
            padding: 20px;
            background: var(--gold-gradient);
            color: #1a1a1a;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.5s;
            border: none;
            cursor: pointer;
        }

        .gold-btn:hover {
            filter: brightness(1.1);
            letter-spacing: 6px;
            color: white;
            background: #1a1a1a;
        }

        /* Animations */
        @keyframes fadeInReveal {
            0% { opacity: 0; transform: translateY(30px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        footer {
            padding: 100px;
            text-align: center;
            background: var(--soft-blush);
            font-family: 'Cinzel', serif;
            letter-spacing: 5px;
            color: var(--deep-gold);
            font-size: 0.9rem;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .brand-title { font-size: 3rem; }
            #product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-box">
            <h1 class="brand-title">Maison de Chi</h1>
            <p class="tagline">L'Extraordinaire Grace d'Angela</p>
        </div>
    </header>

    <h2 class="gallery-title">The Collection</h2>

    <div class="container">
        <div id="product-grid">
            <!-- Items load here from products.json -->
        </div>
    </div>

    <footer>
        MAISON DE CHI <br>
        <small style="font-family: Montserrat; letter-spacing: 2px; font-style: italic;">
            Designed for the Distinguished Woman
        </small>
    </footer>

    <script>
        async function fetchBoutique() {
            try {
                const response = await fetch('products.json');
                const products = await response.json();
                const grid = document.getElementById('product-grid');
                
                products.forEach((item, index) => {
                    grid.innerHTML += `
                        <div class="product-card" style="animation: fadeInReveal ${1 + index * 0.3}s ease-out;">
                            <div class="img-container">
                                <img src="${item.image}" alt="${item.title}">
                            </div>
                            <div class="product-info">
                                <h3 class="product-name">${item.title}</h3>
                                <span class="product-price">₦${item.price}</span>
                                <a href="${item.paymentLink}" class="gold-btn">Acquire Piece</a>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("The boutique is resting. Error:", err);
            }
        }
        fetchBoutique();
    </script>
</body>
</html>
